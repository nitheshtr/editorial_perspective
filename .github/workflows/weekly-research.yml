name: weekly-research

on:
  schedule:
    - cron: "0 5 * * 1" # Mondays 05:00 UTC (before the 06:00 healthcheck)
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: weekly-research
  cancel-in-progress: true

jobs:
  research:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - name: research pull (appends to article cache)
        env:
          TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
        run: |
          if [ -z "$TAVILY_API_KEY" ]; then
            echo "::warning::TAVILY_API_KEY secret not set — weekly research skipped"
            exit 0
          fi
          bun pipeline/src/runner.ts stage=research topic=ai-superrace
      - name: sync windows + volumes
        run: bun scripts/refresh-perspective-sources.ts
      - name: validate
        run: bun tools/validate-topic.ts --all
      - name: commit corpus growth
        run: |
          git config user.name "editorial-pipeline"
          git config user.email "pipeline@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then
            echo "no corpus changes — nothing to commit"
          else
            git commit -m "Weekly research pull — corpus growth (auto)"
            git push
          fi
